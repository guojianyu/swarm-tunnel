<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pod Logs</title>

  <!-- xterm css -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />

  <!-- xterm -->
  <script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>

  <!-- fit addon -->
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: monospace;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #toolbar {
      height: 50px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 0 12px;

      background: #1e1e1e;
      color: #fff;

      border-bottom: 1px solid #333;
    }

    #toolbar label {
      font-size: 14px;
    }

    #toolbar input {
      height: 32px;
      width: 180px;

      background: #111;
      color: white;

      border: 1px solid #555;
      border-radius: 4px;

      padding: 0 8px;

      outline: none;
    }

    #toolbar button {
      height: 32px;

      padding: 0 16px;

      background: #2563eb;
      color: white;

      border: none;
      border-radius: 4px;

      cursor: pointer;
    }

    #toolbar button:hover {
      background: #3b82f6;
    }

    #terminal-container {
      flex: 1;
      width: 100%;
      overflow: hidden;
      background: #000;
    }

    #terminal {
      width: 100%;
      height: 100%;
    }

    .xterm {
      height: 100%;
      padding: 8px;
    }

    .xterm-viewport {
      overflow-y: auto !important;
    }
  </style>
</head>

<body>

  <div id="toolbar">

    <label>Namespace</label>
    <input id="ns" value="default" />

    <label>Pod</label>
    <input id="pod" />

    <label>Container</label>
    <input id="container" />

    <button onclick="connect()">
      Connect
    </button>

  </div>

  <div id="terminal-container">
    <div id="terminal"></div>
  </div>

  <script>

    // terminal
    const term = new Terminal({
      convertEol: true,
      cursorBlink: true,
      fontSize: 14,
      scrollback: 5000,
      theme: {
        background: "#000000",
        foreground: "#ffffff"
      }
    })

    // fit addon
    const fitAddon = new FitAddon.FitAddon()

    term.loadAddon(fitAddon)

    // open terminal
    term.open(document.getElementById("terminal"))

    // fit size
    fitAddon.fit()

    // resize
    window.addEventListener("resize", () => {
      fitAddon.fit()
    })

    let socket = null

    function connect() {

      // close old socket
      if (socket) {
        socket.close()
      }

      // clear terminal
      term.clear()

      const ns = document.getElementById("ns").value
      const pod = document.getElementById("pod").value
      const container = document.getElementById("container").value

    const url =
        `ws://10.2.0.24:30888/proxy?clientid=guojy&address=logs://localhost` +
        `&namespace=${encodeURIComponent(ns)}` +
        `&pod=${encodeURIComponent(pod)}` +
        `&container=${encodeURIComponent(container)}`

      term.writeln(`connecting to ${pod} ...`)
      // websocket
      socket = new WebSocket(url)

      socket.onopen = () => {
        fitAddon.fit()
      }

      const decoder = new TextDecoder("utf-8");

socket.onmessage = (event) => {
    let data = event.data;

    if (typeof data === "string") {
        term.write(data);
        return;
    }

    if (data instanceof ArrayBuffer) {
        term.write(decoder.decode(data));
        return;
    }

    if (data instanceof Blob) {
        data.text().then(t => term.write(t));
    }
};
    //   socket.onmessage = (event) => {
    //     term.write(event.data)
    //   }

      socket.onclose = () => {

        term.writeln("")
        term.writeln("connection closed")
      }

      socket.onerror = (err) => {

        term.writeln("")
        term.writeln("connection error")

        console.error(err)
      }
    }

  </script>

</body>

</html>
